<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Results | TOEIC Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-dark">
    <nav class="navbar flex-between">
        <div class="nav-logo">TOEIC<span>Master</span></div>
        <div class="flex-center" style="gap: 1rem;">
            <a href="index.html" class="nav-link">Home</a>
            <a href="progress.html" class="nav-link">Progress</a>
            <div class="user-chip flex-center">
                <div class="user-avatar">?</div>
                <span id="nav-username">User</span>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 96px; padding-bottom: 4rem;">
        <!-- Section 1: SCORE HEADER -->
        <section class="mb-8 text-center animate-slide-up" style="animation-delay: 0.1s">
            <h1 id="result-title" class="text-gradient">Session Complete! 🎉</h1>
            
            <div class="score-gauge my-8 mx-auto" style="width: 200px; margin-left: auto; margin-right: auto;">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="score-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#8b5cf6"/>
                            <stop offset="100%" stop-color="#06b6d4"/>
                        </linearGradient>
                    </defs>
                    <circle class="score-gauge-bg" cx="100" cy="100" r="80"/>
                    <circle class="score-gauge-progress" cx="100" cy="100" r="80"/>
                </svg>
                <div class="score-gauge-text">
                    <div class="score-gauge-val">0%</div>
                    <div class="score-gauge-label">Score</div>
                </div>
            </div>
            
            <div id="score-details" class="text-muted mb-4">0 / 0 correct • 0m 0s</div>
            <div id="session-badges" class="flex-center" style="gap: 0.5rem"></div>
        </section>

        <!-- Section 2: PERFORMANCE BREAKDOWN -->
        <section class="grid-2 mb-8 animate-slide-up" style="animation-delay: 0.2s">
            <div class="card">
                <h3>Strengths & Weaknesses</h3>
                <div id="theme-breakdown" class="mt-4"></div>
                <div id="theme-recommendation" class="mt-6 text-muted" style="font-size: 0.9rem;"></div>
            </div>
            <div class="card flex-center flex-col">
                <h3 style="align-self: flex-start;">Theme Balance</h3>
                <div class="radar-container mt-4" style="width: 100%; aspect-ratio: 1; max-width: 300px;">
                    <canvas id="radar-chart"></canvas>
                </div>
            </div>
        </section>

        <!-- Section 3: QUICK STATS -->
        <section class="grid-4 mb-8 animate-slide-up" style="animation-delay: 0.3s">
            <div class="stat-card">
                <div class="stat-label">Score %</div>
                <div class="stat-value" id="stat-score">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Correct Answers</div>
                <div class="stat-value" id="stat-correct">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Time Taken</div>
                <div class="stat-value" id="stat-time">0s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Skipped</div>
                <div class="stat-value" id="stat-skipped">0</div>
            </div>
        </section>

        <!-- Section 4: MISSED QUESTIONS -->
        <section class="mb-8 animate-slide-up" style="animation-delay: 0.4s">
            <div class="flex-between card" id="missed-header" style="cursor: pointer;">
                <h3>Questions to review (<span id="missed-count">0</span>)</h3>
                <span id="missed-toggle">▼</span>
            </div>
            <div id="missed-questions-container" class="mt-4 hidden" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Missed questions injected here -->
            </div>
        </section>

        <!-- Section 5: ACTION BUTTONS -->
        <section class="flex-center mb-8 animate-slide-up" style="gap: 1rem; animation-delay: 0.5s">
            <button id="btn-drill" class="btn btn-primary btn-lg hidden">🔄 Drill Mistakes</button>
            <button id="btn-new" class="btn btn-secondary btn-lg" onclick="window.location.href='index.html'">📚 New Session</button>
            <button id="btn-progress" class="btn btn-ghost btn-lg" onclick="window.location.href='progress.html'">📊 View Progress</button>
        </section>
    </main>

    <script type="module" src="js/results.js"></script>
</body>
</html>
